# Развёртывание системы «Управление сервисным центром».
# Запуск: docker compose up --build

services:
  db:
    image: postgres:15-alpine
    container_name: sc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-service_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-service_center}
      POSTGRES_DB: ${POSTGRES_DB:-service_center}
      # Локаль для корректной сортировки кириллицы.
      LANG: ru_RU.utf8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Порт наружу нужен только для подключения DBeaver/psql с хоста.
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      # Приложение стартует только после того, как СУБД начнёт принимать запросы.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-service_center} -d ${POSTGRES_DB:-service_center}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sc_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-service_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-service_center}
      POSTGRES_DB: ${POSTGRES_DB:-service_center}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      MAX_ACTIVE_REQUESTS_PER_MASTER: ${MAX_ACTIVE_REQUESTS_PER_MASTER:-10}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-true}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin12345}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@service-center.local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DEBUG: ${DEBUG:-false}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Монтирование исходников + --reload удобно при разработке.
      # Для продуктивного запуска строку с volumes и command следует убрать.
      - ./app:/code/app:ro
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips="*"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local
